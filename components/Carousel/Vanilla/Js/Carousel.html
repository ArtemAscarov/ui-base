<div
  class="ui-carousel"
  data-carousel
  data-autoplay="4000"
  role="group"
  aria-roledescription="carousel"
  aria-label="Highlights"
>
  <button
    class="ui-carousel__button ui-carousel__button--prev"
    type="button"
    aria-label="Previous slide"
    data-carousel-prev
  ></button>

  <div class="ui-carousel__viewport" data-carousel-viewport>
    <div class="ui-carousel__track" data-carousel-track>
      <div class="ui-carousel__slide">First</div>
      <div class="ui-carousel__slide">Second</div>
      <div class="ui-carousel__slide">Third</div>
    </div>
  </div>

  <button
    class="ui-carousel__button ui-carousel__button--next"
    type="button"
    aria-label="Next slide"
    data-carousel-next
  ></button>

  <div class="ui-carousel__dots" data-carousel-dots></div>

  <div
    class="ui-carousel__status"
    role="status"
    aria-live="polite"
    data-carousel-status
  ></div>
</div>
