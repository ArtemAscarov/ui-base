<label class="ui-checkbox" for="checkbox-terms">
  <input
    class="ui-checkbox__input"
    id="checkbox-terms"
    type="checkbox"
    name="terms"
    data-checkbox-input
  />
  <span class="ui-checkbox__box"></span>
  Accept terms
</label>

<label class="ui-checkbox" for="checkbox-news">
  <input
    class="ui-checkbox__input"
    id="checkbox-news"
    type="checkbox"
    name="news"
    checked
    data-checkbox-input
  />
  <span class="ui-checkbox__box"></span>
  Subscribe
</label>

<label class="ui-checkbox" for="checkbox-all">
  <input
    class="ui-checkbox__input"
    id="checkbox-all"
    type="checkbox"
    name="all"
    data-checkbox-input
    data-indeterminate
  />
  <span class="ui-checkbox__box"></span>
  Select all
</label>

<label class="ui-checkbox" for="checkbox-locked">
  <input
    class="ui-checkbox__input"
    id="checkbox-locked"
    type="checkbox"
    name="locked"
    disabled
    data-checkbox-input
  />
  <span class="ui-checkbox__box"></span>
  Unavailable
</label>
