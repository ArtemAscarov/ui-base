<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Carousel</title>
    <link rel="stylesheet" href="../../default.css" />
    <link rel="stylesheet" href="../../demo.css" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <fieldset class="demo-frame">
      <legend>Carousel</legend>

      <div class="demo-center">
        <div
          class="ui-carousel"
          data-ui-carousel
          data-autoplay="4000"
          role="group"
          aria-roledescription="carousel"
          aria-label="Demo"
        >
          <button
            class="ui-carousel__button ui-carousel__button--prev"
            type="button"
            aria-label="Previous slide"
          ></button>

          <div class="ui-carousel__viewport">
            <div class="ui-carousel__track">
              <div class="ui-carousel__slide">
                <div class="demo-slide">Demo 1</div>
              </div>
              <div class="ui-carousel__slide">
                <div class="demo-slide">Demo 2</div>
              </div>
              <div class="ui-carousel__slide">
                <div class="demo-slide">Demo 3</div>
              </div>
            </div>
          </div>

          <button
            class="ui-carousel__button ui-carousel__button--next"
            type="button"
            aria-label="Next slide"
          ></button>
        </div>
      </div>

      <div class="demo-center">
        <div
          class="ui-carousel demo-carousel--multi"
          data-ui-carousel
          role="group"
          aria-roledescription="carousel"
          aria-label="Demo multiple"
        >
          <button
            class="ui-carousel__button ui-carousel__button--prev"
            type="button"
            aria-label="Previous slide"
          ></button>

          <div class="ui-carousel__viewport">
            <div class="ui-carousel__track">
              <div class="ui-carousel__slide">
                <div class="demo-slide">Demo 1</div>
              </div>
              <div class="ui-carousel__slide">
                <div class="demo-slide">Demo 2</div>
              </div>
              <div class="ui-carousel__slide">
                <div class="demo-slide">Demo 3</div>
              </div>
              <div class="ui-carousel__slide">
                <div class="demo-slide">Demo 4</div>
              </div>
              <div class="ui-carousel__slide">
                <div class="demo-slide">Demo 5</div>
              </div>
              <div class="ui-carousel__slide">
                <div class="demo-slide">Demo 6</div>
              </div>
            </div>
          </div>

          <button
            class="ui-carousel__button ui-carousel__button--next"
            type="button"
            aria-label="Next slide"
          ></button>
        </div>
      </div>
    </fieldset>

    <script src="./index.js"></script>
  </body>
</html>
