<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Checkbox</title>
    <link rel="stylesheet" href="../../default.css" />
    <link rel="stylesheet" href="../../demo.css" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <fieldset class="demo-frame">
      <legend>Checkbox</legend>

      <div class="demo-stack">
        <label class="ui-checkbox" for="checkbox-unchecked">
          <input
            id="checkbox-unchecked"
            class="ui-checkbox__input"
            type="checkbox"
          />
          <div class="ui-checkbox__box"></div>
          Demo
        </label>

        <label class="ui-checkbox" for="checkbox-checked">
          <input
            checked
            id="checkbox-checked"
            class="ui-checkbox__input"
            type="checkbox"
          />
          <div class="ui-checkbox__box"></div>
          Demo checked
        </label>

        <label class="ui-checkbox" for="checkbox-mixed">
          <input
            data-indeterminate
            id="checkbox-mixed"
            class="ui-checkbox__input"
            type="checkbox"
          />
          <div class="ui-checkbox__box"></div>
          Demo mixed
        </label>

        <label class="ui-checkbox" for="checkbox-disabled">
          <input
            disabled
            id="checkbox-disabled"
            class="ui-checkbox__input"
            type="checkbox"
          />
          <div class="ui-checkbox__box"></div>
          Demo disabled
        </label>
      </div>
    </fieldset>

    <script src="./index.js"></script>
  </body>
</html>
