<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Radio</title>
    <link rel="stylesheet" href="../../default.css" />
    <link rel="stylesheet" href="../../demo.css" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <fieldset class="demo-frame">
      <legend>Radio</legend>

      <div class="demo-stack">
        <label class="ui-radio" for="radio-unchecked">
          <input
            id="radio-unchecked"
            class="ui-radio__input"
            name="demo"
            type="radio"
          />
          <div class="ui-radio__circle"></div>
          Demo
        </label>

        <label class="ui-radio" for="radio-checked">
          <input
            checked
            id="radio-checked"
            class="ui-radio__input"
            name="demo"
            type="radio"
          />
          <div class="ui-radio__circle"></div>
          Demo checked
        </label>

        <label class="ui-radio" for="radio-disabled">
          <input
            disabled
            id="radio-disabled"
            class="ui-radio__input"
            name="demo"
            type="radio"
          />
          <div class="ui-radio__circle"></div>
          Demo disabled
        </label>
      </div>
    </fieldset>
  </body>
</html>
