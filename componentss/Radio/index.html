<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Radio</title>
    <link rel="stylesheet" href="/default.css" />
    <link rel="stylesheet" href="/demo.css" />
    <link rel="stylesheet" href="./style.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <fieldset class="demo-frame">
      <legend>Radio</legend>

      <div class="demo-stack">
        <label class="ui-radio" for="radio-unchecked">
          <input
            id="radio-unchecked"
            class="ui-radio__input"
            name="radioGroup"
            type="radio"
          />
          <div class="ui-radio__circle"></div>
          Не отмечено
        </label>

        <label class="ui-radio" for="radio-checked">
          <input
            checked
            id="radio-checked"
            class="ui-radio__input"
            name="radioGroup"
            type="radio"
          />
          <div class="ui-radio__circle"></div>
          Отмечено
        </label>
      </div>
    </fieldset>
  </body>
</html>
