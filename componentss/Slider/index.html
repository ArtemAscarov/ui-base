<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Slider</title>
    <link rel="stylesheet" href="/default.css" />
    <link rel="stylesheet" href="/demo.css" />
    <link rel="stylesheet" href="./style.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <fieldset class="demo-frame demo-frame--fill">
      <legend>Slider</legend>

      <div class="demo-stack demo-stack--centered">
        <div class="ui-slider">
          <div class="ui-slider__header">
            <p>Возраст</p>
            <p id="firstSliderValue">18</p>
          </div>
          <div class="ui-slider__body">
            <p id="firstSliderMin">18</p>
            <div class="ui-slider__track" id="firstSliderTrack">
              <div class="ui-slider__range" id="firstSliderRange"></div>
              <div class="ui-slider__thumb" id="firstSliderThumb"></div>
            </div>
            <p id="firstSliderMax">90</p>
          </div>
        </div>

        <div class="ui-slider">
          <div class="ui-slider__header">
            <p>Цена</p>
            <p id="secondSliderValue">0 - 7000</p>
          </div>
          <div class="ui-slider__body">
            <p id="secondSliderMin">0</p>
            <div class="ui-slider__track" id="secondSliderTrack">
              <div class="ui-slider__range" id="secondSliderRange"></div>
              <div class="ui-slider__thumb" id="secondSliderStartThumb"></div>
              <div class="ui-slider__thumb" id="secondSliderEndThumb"></div>
            </div>
            <p id="secondSliderMax">7000</p>
          </div>
        </div>
      </div>
    </fieldset>

    <script src="./index.js"></script>
  </body>
</html>
