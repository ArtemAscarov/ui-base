<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Slider</title>
    <link rel="stylesheet" href="../../default.css" />
    <link rel="stylesheet" href="../../demo.css" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <fieldset class="demo-frame">
      <legend>Slider</legend>

      <div class="demo-stack demo-stack--centered">
        <div
          class="ui-slider"
          data-ui-slider
          data-min="0"
          data-max="100"
          data-step="1"
        >
          <div class="ui-slider__header">
            <span class="ui-slider__title">Demo</span>
            <span class="ui-slider__value"></span>
          </div>
          <div class="ui-slider__body">
            <span class="ui-slider__bound ui-slider__bound--min"></span>
            <div class="ui-slider__track">
              <div class="ui-slider__range"></div>
              <div
                class="ui-slider__thumb"
                role="slider"
                tabindex="0"
                aria-label="Demo"
                data-value="40"
              ></div>
            </div>
            <span class="ui-slider__bound ui-slider__bound--max"></span>
          </div>
        </div>

        <div
          class="ui-slider"
          data-ui-slider
          data-min="0"
          data-max="1000"
          data-step="10"
        >
          <div class="ui-slider__header">
            <span class="ui-slider__title">Demo range</span>
            <span class="ui-slider__value"></span>
          </div>
          <div class="ui-slider__body">
            <span class="ui-slider__bound ui-slider__bound--min"></span>
            <div class="ui-slider__track">
              <div class="ui-slider__range"></div>
              <div
                class="ui-slider__thumb"
                role="slider"
                tabindex="0"
                aria-label="Demo from"
                data-value="200"
              ></div>
              <div
                class="ui-slider__thumb"
                role="slider"
                tabindex="0"
                aria-label="Demo to"
                data-value="800"
              ></div>
            </div>
            <span class="ui-slider__bound ui-slider__bound--max"></span>
          </div>
        </div>
      </div>
    </fieldset>

    <script src="./index.js"></script>
  </body>
</html>
